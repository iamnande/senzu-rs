# cargo deny check: known holes, licenses we can ship, and crates we didn't mean to pull in

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
