cognitive-complexity-threshold = 100
disallowed-names = []
too-many-arguments-threshold = 3
type-complexity-threshold = 375

allow-expect-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

# error, info and debug only. error means the command failed
disallowed-macros = [
  { path = "log::log", reason = "senzu logs through tracing" },
  { path = "log::trace", reason = "senzu logs through tracing" },
  { path = "log::debug", reason = "senzu logs through tracing" },
  { path = "log::info", reason = "senzu logs through tracing" },
  { path = "log::warn", reason = "senzu logs through tracing" },
  { path = "log::error", reason = "senzu logs through tracing" },
  { path = "tracing::trace", reason = "use debug" },
  { path = "tracing::trace_span", reason = "use debug_span" },
  { path = "tracing::warn", reason = "use info with an outcome, or error if it failed" },
  { path = "tracing::warn_span", reason = "use info_span" },
]

# the environment comes in through config::Env, so tests can hand one in
disallowed-methods = [
  { path = "std::env::var", reason = "read it in config::Env" },
  { path = "std::env::var_os", reason = "read it in config::Env" },
  { path = "std::env::set_var", reason = "unsound; pass the value in instead" },
  { path = "std::env::remove_var", reason = "unsound; pass the value in instead" },
]
